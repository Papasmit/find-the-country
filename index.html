<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Find the Country</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --sea:#cfe1e8; --land:#fbfcfa; --land-hover:#c6e6dc; --edge:#8fb1bc; --grid:#b4cdd6;
  --found:#46b98c; --missed:#f0bd4f; --wrong:#e5594f;
  --ink:#10303f; --muted:#4c6b78; --panel:#ffffff; --panel-line:#b9d0d8; --btn:#10303f; --btn-ink:#f2f8f9;
  --shade:rgba(207,225,232,.94);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --sea:#0c1f2e; --land:#2b5560; --land-hover:#4a8a89; --edge:#0c1f2e; --grid:#16384b;
    --found:#3fb68b; --missed:#e8a93a; --wrong:#ea5f55;
    --ink:#e8f1f3; --muted:#92abb3; --panel:#12303f; --panel-line:#24485a; --btn:#e8f1f3; --btn-ink:#0c1f2e;
    --shade:rgba(12,31,46,.94);
  }
}
:root[data-theme="dark"]{
  --sea:#0c1f2e; --land:#2b5560; --land-hover:#4a8a89; --edge:#0c1f2e; --grid:#16384b;
  --found:#3fb68b; --missed:#e8a93a; --wrong:#ea5f55;
  --ink:#e8f1f3; --muted:#92abb3; --panel:#12303f; --panel-line:#24485a; --btn:#e8f1f3; --btn-ink:#0c1f2e;
  --shade:rgba(12,31,46,.94);
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
html{background:var(--sea)}
body{background:var(--sea);color:var(--ink);overflow:hidden;position:relative;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}

#stage{position:absolute;inset:0;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
#stage:active{cursor:grabbing}
#map{width:100%;height:100%;display:block}
.grid{fill:none;stroke:var(--grid);stroke-width:1;vector-effect:non-scaling-stroke}
.land{fill:var(--land);stroke:var(--edge);stroke-width:.8;vector-effect:non-scaling-stroke;stroke-linejoin:round;transition:fill .18s}
@media (hover:hover){ .land:hover{fill:var(--land-hover)} }
.land.found{fill:var(--found)}
.land.missed{fill:var(--missed)}
.land.wrong{fill:var(--wrong)}
.land.pulse{animation:pulse 1s ease-in-out 3}
@keyframes pulse{50%{fill:var(--wrong)}}

.layer{position:absolute;left:0;right:0;pointer-events:none;padding:0 clamp(14px,3vw,32px)}
.top{top:env(safe-area-inset-top,0px);padding-top:clamp(14px,2.4vw,26px);padding-bottom:36px;background:linear-gradient(var(--shade),transparent)}
.bottom{bottom:env(safe-area-inset-bottom,0px);padding-bottom:clamp(14px,2.4vw,26px);padding-top:40px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;background:linear-gradient(transparent,var(--shade))}
.layer button,.layer .toast{pointer-events:auto}

#question{margin:0;font-size:clamp(30px,6.2vw,64px);line-height:1.02;font-weight:800;letter-spacing:-.025em;font-variation-settings:"opsz" 96;max-width:18ch;text-wrap:balance}
.sub{display:flex;align-items:center;gap:14px;margin-top:12px;min-height:26px;color:var(--muted);font-size:clamp(14px,1.9vw,17px)}
.pips{display:flex;gap:6px}
.pip{width:12px;height:12px;border-radius:50%;background:var(--ink);transition:background .2s,transform .2s}
.pip.spent{background:transparent;box-shadow:inset 0 0 0 2px var(--muted);transform:scale(.85)}

.stats{display:flex;gap:22px;font-size:clamp(14px,1.9vw,17px);color:var(--muted)}
.stats b{display:block;font-size:clamp(22px,3.4vw,32px);font-weight:800;color:var(--ink);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.actions{display:flex;gap:10px}
.btn{border:2px solid var(--ink);background:transparent;border-radius:999px;padding:11px 20px;font-weight:600;font-size:16px;min-height:44px}
.btn:hover{background:var(--ink);color:var(--sea)}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn.primary{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.btn.primary:hover{opacity:.9;background:var(--btn);color:var(--btn-ink)}

.zoom{position:absolute;right:clamp(14px,3vw,32px);top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:8px;z-index:2}
.zbtn{width:44px;height:44px;border-radius:12px;border:2px solid var(--panel-line);background:var(--panel);display:grid;place-items:center;padding:0}
.zbtn:hover{border-color:var(--ink)}
.zbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

.toast{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 104px);transform:translate(-50%,8px);opacity:0;transition:opacity .2s,transform .2s;background:var(--btn);color:var(--btn-ink);padding:10px 18px;border-radius:999px;font-weight:600;font-size:16px;max-width:calc(100% - 32px);text-align:center;pointer-events:none!important;z-index:3}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.good{background:var(--found);color:#06251b}
.toast.bad{background:var(--wrong);color:#fff}

.overlay{position:absolute;inset:0;z-index:5;display:grid;place-items:center;padding:20px;background:color-mix(in srgb,var(--sea) 78%,transparent);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.overlay[hidden]{display:none}
.card{width:min(520px,100%);max-height:100%;overflow:auto;background:var(--panel);border:2px solid var(--panel-line);border-radius:22px;padding:clamp(22px,4vw,36px)}
.card h1,.card h2{margin:0 0 10px;font-size:clamp(32px,6vw,52px);line-height:1;font-weight:800;letter-spacing:-.025em;font-variation-settings:"opsz" 96}
.card p{margin:0 0 20px;line-height:1.5;font-size:17px;color:var(--muted);max-width:44ch}
.card .meta{font-size:15px;margin:16px 0 0;color:var(--muted)}
.final{font-size:clamp(54px,12vw,88px);font-weight:800;letter-spacing:-.04em;line-height:1;margin:6px 0 4px;font-variant-numeric:tabular-nums}
.final small{font-size:.3em;font-weight:600;color:var(--muted);letter-spacing:0;margin-left:6px}
.results{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 22px;padding:0;list-style:none}
.results li{border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600;border:2px solid var(--panel-line)}
.results li.ok{border-color:var(--found)}
.results li.no{border-color:var(--missed);color:var(--muted)}

@media (max-width:560px){
  .zoom{top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 112px);transform:none}
  .stats{gap:16px}
  .btn{padding:10px 16px}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}
</style>
</head>

<div id="stage"><svg id="map" role="application" aria-label="World map. Choose a country by clicking it."><g id="world"></g></svg></div>

<div class="layer top">
  <h2 id="question" style="margin:0">Find the country</h2>
  <div class="sub"><div class="pips" id="pips" aria-label="Tries left"></div><span id="hint"></span></div>
</div>

<div class="zoom">
  <button class="zbtn" id="zin" aria-label="Zoom in"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  <button class="zbtn" id="zout" aria-label="Zoom out"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
  <button class="zbtn" id="zhome" aria-label="Reset view"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4v3M12 17v3M4 12h3M17 12h3"/></svg></button>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<div class="layer bottom">
  <div class="stats">
    <div><span>Round</span><b id="round">0/10</b></div>
    <div><span>Score</span><b id="score">0</b></div>
  </div>
  <div class="actions">
    <button class="btn" id="hintBtn">Hint</button>
    <button class="btn" id="skipBtn">Skip</button>
  </div>
</div>

<section class="overlay" id="start">
  <div class="card">
    <h1>Find the country</h1>
    <p>You get ten countries, one at a time. Click each one on the map. Three tries per country, and a hint costs points. Scroll or pinch to zoom, drag to pan.</p>
    <button class="btn primary" id="startBtn">Start</button>
    <p class="meta" id="best"></p>
  </div>
</section>

<section class="overlay" id="end" hidden>
  <div class="card">
    <h2 id="endTitle">Done</h2>
    <div class="final"><span id="finalScore">0</span><small>of 1000</small></div>
    <p id="endNote"></p>
    <ul class="results" id="results"></ul>
    <button class="btn primary" id="againBtn">Play again</button>
  </div>
</section>

const NAMES = {
  'United States of America':'United States','United Republic of Tanzania':'Tanzania',
  'Democratic Republic of the Congo':'DR Congo','Republic of Serbia':'Serbia',
  'Macedonia':'North Macedonia','Swaziland':'Eswatini','East Timor':'Timor-Leste',
  'The Bahamas':'Bahamas','Czech Republic':'Czechia','Guinea Bissau':'Guinea-Bissau'
};
const disp = c => NAMES[c.name] || c.name;
const ROUNDS = 10, MAX_TRIES = 3, ASK_MIN_AREA = 14;
const $ = s => document.querySelector(s);
const NS = 'http://www.w3.org/2000/svg';
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- build map ---------- */
const stage = $('#stage'), svg = $('#map'), world = $('#world');
const byId = {}, countries = {};
(function buildGrid(){
  const S = MAP.W / 360, TOP = 84;
  let d = '';
  for (let lon = -150; lon <= 180; lon += 30) { const x = (lon + 180) * S; d += `M${x} 0V${MAP.H}`; }
  for (let lat = -30; lat <= 60; lat += 30) { const y = (TOP - lat) * S; d += `M0 ${y}H${MAP.W}`; }
  const g = document.createElementNS(NS, 'path'); g.setAttribute('d', d); g.setAttribute('class', 'grid'); world.appendChild(g);
})();
MAP.countries.forEach(c => {
  const p = document.createElementNS(NS, 'path');
  p.setAttribute('d', c.d); p.setAttribute('class', 'land'); p.dataset.id = c.id;
  p.setAttribute('role', 'button'); p.setAttribute('tabindex', '0'); p.setAttribute('aria-label', disp(c));
  p.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); guess(c.id); } });
  world.appendChild(p); byId[c.id] = p; countries[c.id] = c;
});
const askable = MAP.countries.filter(c => c.area >= ASK_MIN_AREA);

/* ---------- camera ---------- */
let vw = 1, vh = 1, KMIN = .1, KMAX = 24;
const cam = { x: 0, y: 0, k: 1 };
function homeCam(){
  const k = Math.max(vw / MAP.W, vh * 0.3 / MAP.H);
  return { k, x: (vw - MAP.W * k) / 2, y: (vh - MAP.H * k) / 2 };
}
function clampCam(){
  const w = MAP.W * cam.k, h = MAP.H * cam.k, mx = vw * .25, my = vh * .25;
  cam.x = w <= vw ? (vw - w) / 2 : Math.min(mx, Math.max(vw - w - mx, cam.x));
  cam.y = h <= vh ? (vh - h) / 2 : Math.min(my, Math.max(vh - h - my, cam.y));
}
function applyCam(){ world.setAttribute('transform', `translate(${cam.x} ${cam.y}) scale(${cam.k})`); }
function zoomAt(px, py, f){
  const nk = Math.min(KMAX, Math.max(KMIN, cam.k * f)), r = nk / cam.k;
  cam.x = px - (px - cam.x) * r; cam.y = py - (py - cam.y) * r; cam.k = nk;
  clampCam(); applyCam();
}
let flyId = 0;
function flyTo(t, ms = 750){
  const id = ++flyId;
  if (reduceMotion) { Object.assign(cam, t); clampCam(); applyCam(); return; }
  const a = { ...cam }, t0 = performance.now();
  (function step(now){
    if (id !== flyId) return;
    let u = Math.min(1, (now - t0) / ms); u = 1 - Math.pow(1 - u, 3);
    cam.k = a.k * Math.pow(t.k / a.k, u);
    cam.x = a.x + (t.x - a.x) * u; cam.y = a.y + (t.y - a.y) * u;
    clampCam(); applyCam();
    if (u < 1) requestAnimationFrame(step);
  })(t0);
}
function flyToCountry(id){
  const b = byId[id].getBBox();
  const k = Math.min(KMAX, Math.max(cam.k, Math.min(vw * .45 / b.width, vh * .38 / b.height)));
  flyTo({ k, x: vw / 2 - (b.x + b.width / 2) * k, y: vh * .58 - (b.y + b.height / 2) * k });
}
function resize(){
  const r = stage.getBoundingClientRect(); vw = r.width; vh = r.height;
  KMIN = Math.min(vw / MAP.W, vh / MAP.H);
  if (!resize.done) { Object.assign(cam, homeCam()); resize.done = true; }
  clampCam(); applyCam();
}
addEventListener('resize', resize);

/* ---------- input: pan, pinch, wheel, click ---------- */
const ptrs = new Map(); let drag = null, pinch = null;
const pinchState = () => {
  const [a, b] = [...ptrs.values()], r = stage.getBoundingClientRect();
  return { d: Math.hypot(a.x - b.x, a.y - b.y) || 1, cx: (a.x + b.x) / 2 - r.left, cy: (a.y + b.y) / 2 - r.top, k: cam.k, camx: cam.x, camy: cam.y };
};
stage.addEventListener('pointerdown', e => {
  flyId++;
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  stage.setPointerCapture(e.pointerId);
  if (ptrs.size === 1) drag = { sx: e.clientX, sy: e.clientY, cx: cam.x, cy: cam.y, moved: false };
  else if (ptrs.size === 2) { pinch = pinchState(); drag = null; }
});
stage.addEventListener('pointermove', e => {
  if (!ptrs.has(e.pointerId)) return;
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pinch && ptrs.size >= 2) {
    const [a, b] = [...ptrs.values()], r = stage.getBoundingClientRect();
    const d = Math.hypot(a.x - b.x, a.y - b.y), cx = (a.x + b.x) / 2 - r.left, cy = (a.y + b.y) / 2 - r.top;
    const nk = Math.min(KMAX, Math.max(KMIN, pinch.k * d / pinch.d));
    const wx = (pinch.cx - pinch.camx) / pinch.k, wy = (pinch.cy - pinch.camy) / pinch.k;
    cam.k = nk; cam.x = cx - wx * nk; cam.y = cy - wy * nk; clampCam(); applyCam();
  } else if (drag) {
    const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
    if (!drag.moved && Math.hypot(dx, dy) > 6) drag.moved = true;
    if (drag.moved) { cam.x = drag.cx + dx; cam.y = drag.cy + dy; clampCam(); applyCam(); }
  }
});
function endPtr(e, canClick){
  if (!ptrs.has(e.pointerId)) return;
  const wasClick = canClick && drag && !drag.moved && ptrs.size === 1;
  ptrs.delete(e.pointerId);
  if (wasClick) {
    const el = document.elementFromPoint(e.clientX, e.clientY), p = el && el.closest && el.closest('path[data-id]');
    if (p) guess(p.dataset.id);
  }
  if (ptrs.size < 2) pinch = null;
  if (ptrs.size === 0) drag = null;
  else if (ptrs.size === 1) { const [q] = [...ptrs.values()]; drag = { sx: q.x, sy: q.y, cx: cam.x, cy: cam.y, moved: true }; }
}
stage.addEventListener('pointerup', e => endPtr(e, true));
stage.addEventListener('pointercancel', e => endPtr(e, false));
stage.addEventListener('wheel', e => {
  e.preventDefault(); flyId++;
  const r = stage.getBoundingClientRect();
  zoomAt(e.clientX - r.left, e.clientY - r.top, Math.exp(-e.deltaY * (e.ctrlKey ? .01 : .0015)));
}, { passive: false });
$('#zin').onclick = () => zoomAt(vw / 2, vh / 2, 1.6);
$('#zout').onclick = () => zoomAt(vw / 2, vh / 2, 1 / 1.6);
$('#zhome').onclick = () => flyTo(homeCam());

/* ---------- game ---------- */
const el = { q: $('#question'), pips: $('#pips'), hint: $('#hint'), round: $('#round'), score: $('#score'),
  toast: $('#toast'), hintBtn: $('#hintBtn'), skipBtn: $('#skipBtn') };
let order = [], round = 0, score = 0, wrong = 0, hinted = false, results = [], current = null, locked = true, toastT = 0;

function getBest(){ try { return parseInt(localStorage.getItem('geo_best') || '0', 10) || 0; } catch (e) { return 0; } }
function setBest(v){ try { localStorage.setItem('geo_best', String(v)); } catch (e) {} }
function showBest(){ const b = getBest(); $('#best').textContent = b ? `Your best: ${b} of 1000` : ''; }

function toast(msg, kind){
  clearTimeout(toastT);
  el.toast.textContent = msg; el.toast.className = 'toast show ' + (kind || '');
  toastT = setTimeout(() => el.toast.classList.remove('show'), 1800);
}
function renderPips(){
  el.pips.innerHTML = '';
  for (let i = 0; i < MAX_TRIES; i++) {
    const s = document.createElement('span'); s.className = 'pip' + (i < wrong ? ' spent' : ''); el.pips.appendChild(s);
  }
}
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

function startGame(){
  Object.values(byId).forEach(p => p.setAttribute('class', 'land'));
  order = shuffle(askable).slice(0, ROUNDS); round = 0; score = 0; results = [];
  el.score.textContent = '0';
  $('#start').hidden = true; $('#end').hidden = true;
  flyTo(homeCam(), 400);
  nextRound();
}
function nextRound(){
  if (round >= ROUNDS) return endGame();
  current = order[round]; wrong = 0; hinted = false; locked = false;
  el.q.textContent = `Where is ${disp(current)}?`;
  el.hint.textContent = ''; el.round.textContent = `${round + 1}/${ROUNDS}`;
  el.hintBtn.disabled = false; el.skipBtn.disabled = false;
  renderPips();
}
function finishRound(delay){
  locked = true; el.hintBtn.disabled = true; el.skipBtn.disabled = true;
  round++; setTimeout(nextRound, delay);
}
function reveal(msg){
  results.push({ name: disp(current), pts: 0, ok: false });
  byId[current.id].classList.add('missed', 'pulse');
  flyToCountry(current.id);
  toast(msg || `It's ${disp(current)}`, 'bad');
  finishRound(2600);
  setTimeout(() => { if (round < ROUNDS) flyTo(homeCam()); }, 2000);
}
function guess(id){
  if (locked || !current) return;
  if (id === current.id) {
    const pts = Math.max(10, 100 - 35 * wrong - (hinted ? 25 : 0));
    score += pts; el.score.textContent = score;
    results.push({ name: disp(current), pts, ok: true });
    byId[id].classList.add('found');
    toast(`Correct, +${pts}`, 'good');
    finishRound(900);
  } else {
    wrong++; renderPips();
    const p = byId[id]; p.classList.add('wrong');
    setTimeout(() => p.classList.remove('wrong'), 650);
    if (wrong >= MAX_TRIES) reveal();
    else toast(`That's ${disp(countries[id])}. Try again.`, 'bad');
  }
}
el.hintBtn.onclick = () => {
  if (locked || hinted) return;
  hinted = true; el.hintBtn.disabled = true;
  const n = disp(current);
  el.hint.textContent = `Starts with ${n[0]}, ${n.replace(/[^A-Za-z]/g, '').length} letters`;
};
el.skipBtn.onclick = () => { if (!locked) reveal(`Skipped. It's ${disp(current)}`); };

function endGame(){
  if (score > getBest()) setBest(score);
  $('#finalScore').textContent = score;
  const right = results.filter(r => r.ok).length;
  $('#endTitle').textContent = score >= 850 ? 'Excellent run' : score >= 550 ? 'Solid run' : score >= 250 ? 'Good start' : 'Keep exploring';
  $('#endNote').textContent = `${right} of ${ROUNDS} found. ${score >= getBest() && score > 0 ? 'That is your best score.' : 'Your best is ' + getBest() + '.'}`;
  const ul = $('#results'); ul.innerHTML = '';
  results.forEach(r => { const li = document.createElement('li'); li.className = r.ok ? 'ok' : 'no'; li.textContent = r.ok ? `${r.name} +${r.pts}` : `${r.name} missed`; ul.appendChild(li); });
  el.q.textContent = 'Game over'; el.hint.textContent = '';
  $('#end').hidden = false; $('#againBtn').focus();
}
$('#startBtn').onclick = startGame;
$('#againBtn').onclick = startGame;

showBest(); resize();
</script>
</body>
</html>
